<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>교인 심방 관리</title>
<script>
  // 저장해 둔 화면 색을 CSS 보다 먼저 적용해, 열 때 색이 번쩍이지 않게 한다
  try {
    var savedTheme = localStorage.getItem("church-care-theme");
    if (savedTheme === "light" || savedTheme === "dark") {
      document.documentElement.setAttribute("data-theme", savedTheme);
    }
  } catch (e) { /* 저장소를 못 쓰면 시스템 설정을 따른다 */ }
</script>
<style>
  :root {
    --bg: #f6f4ef;
    --panel: #ffffff;
    --line: #e3ded4;
    --text: #2b2722;
    --muted: #7d766c;
    --accent: #6b5b95;
    --accent-soft: #efeaf7;
    --accent-text: #ffffff;
    --lv0: #2f7d59;   --lv0-soft: #e4f2ea;
    --lv20: #8a7318;  --lv20-soft: #f7f0d9;
    --lv40: #a5631c;  --lv40-soft: #faeadb;
    --lv60: #a8443a;  --lv60-soft: #fae8e5;
    --none: #6b6259;  --none-soft: #eae6e0;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.05);
  }
  /* 시스템 설정을 따를 때 (밝게를 직접 고른 경우는 제외) */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1917;
      --panel: #242120;
      --line: #38332f;
      --text: #ece7e0;
      --muted: #a49c92;
      --accent: #a794d6;
      --accent-soft: #322b44;
      --accent-text: #1b1917;
      --lv0: #7dc9a3;   --lv0-soft: #23342c;
      --lv20: #d8c165;  --lv20-soft: #383320;
      --lv40: #e0a468;  --lv40-soft: #3a2f22;
      --lv60: #e79187;  --lv60-soft: #3a2724;
      --none: #b0a89e;  --none-soft: #322e2b;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }

  /* 어둡게를 직접 고른 경우 */
  :root[data-theme="dark"] {
    --bg: #1b1917;
    --panel: #242120;
    --line: #38332f;
    --text: #ece7e0;
    --muted: #a49c92;
    --accent: #a794d6;
    --accent-soft: #322b44;
    --accent-text: #1b1917;
    --lv0: #7dc9a3;   --lv0-soft: #23342c;
    --lv20: #d8c165;  --lv20-soft: #383320;
    --lv40: #e0a468;  --lv40-soft: #3a2f22;
    --lv60: #e79187;  --lv60-soft: #3a2724;
    --none: #b0a89e;  --none-soft: #322e2b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic",
                 "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 940px; margin: 0 auto; padding: 24px 16px 80px; }

  header.top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  header.top .title { flex: 1 1 260px; }
  header.top h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.02em; }
  header.top p { margin: 0; color: var(--muted); font-size: 14px; }
  .head-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .theme { border-radius: 999px; padding: 6px 10px; font-size: 16px; line-height: 1; }
  .account { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }

  .notice {
    display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap;
    background: var(--accent-soft); color: var(--accent);
    border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 16px;
  }
  .notice a { color: inherit; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .toolbar .grow { flex: 1 1 180px; }

  input, select, textarea, button { font: inherit; color: inherit; }
  input[type=text], input[type=date], input[type=search], select, textarea {
    width: 100%; padding: 9px 11px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 84px; }
  label.field { display: block; margin-bottom: 10px; }
  label.field > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }

  button { cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
           background: var(--panel); padding: 9px 14px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.primary:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 6px 8px; }
  button.ghost:hover { color: var(--text); background: var(--bg); }
  button.danger:hover { border-color: var(--lv60); color: var(--lv60); }
  button.google { display: inline-flex; align-items: center; gap: 8px; }
  button.google svg { width: 18px; height: 18px; }

  .district { margin-bottom: 22px; }
  .district > h2 { display: flex; align-items: baseline; gap: 8px;
                   font-size: 15px; margin: 0 0 8px 2px; letter-spacing: -.01em; }
  .district > h2 small { font-weight: 400; color: var(--muted); font-size: 12px; }

  .list { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
          box-shadow: var(--shadow); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 8px;
         border-top: 1px solid var(--line); padding-right: 10px; }
  .row-main { flex: 1 1 auto; min-width: 0; display: block; text-align: left;
              background: none; border: 0; border-radius: 0; padding: 12px 14px; }
  .row-main:hover { border-color: transparent; }
  .care-btn { flex: 0 0 auto; border: 0; background: none; border-radius: 999px;
              padding: 4px 7px; font-size: 17px; line-height: 1;
              color: var(--muted); opacity: .55; }
  .care-btn:hover { opacity: 1; background: var(--bg); border-color: transparent; }
  .care-btn[aria-pressed="true"] { color: var(--accent); opacity: 1; }
  .row:first-child { border-top: 0; }
  .row:hover { background: var(--bg); }
  .row .who { flex: 1 1 auto; min-width: 0; }
  .row .name { font-weight: 600; }
  .row .role { color: var(--muted); font-size: 12px; margin-left: 6px; font-weight: 400; }
  .row .when { color: var(--muted); font-size: 12px; margin-left: 8px; font-weight: 400;
               font-variant-numeric: tabular-nums; }
  .row .last { font-size: 12px; color: var(--muted); margin-top: 1px;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .badge { flex: 0 0 auto; font-size: 12px; padding: 3px 9px; border-radius: 999px;
           font-variant-numeric: tabular-nums; white-space: nowrap; }
  .badge.lv0 { background: var(--lv0-soft); color: var(--lv0); }
  .badge.lv20 { background: var(--lv20-soft); color: var(--lv20); }
  .badge.lv40 { background: var(--lv40-soft); color: var(--lv40); }
  .badge.lv60 { background: var(--lv60-soft); color: var(--lv60); }
  .badge.none { background: var(--none-soft); color: var(--none); }

  .empty { text-align: center; color: var(--muted); padding: 44px 16px; font-size: 14px; }

  dialog { border: 1px solid var(--line); border-radius: 16px; padding: 0;
           width: min(520px, calc(100vw - 24px)); background: var(--panel); color: var(--text);
           box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .dlg-head { display: flex; align-items: center; gap: 8px; padding: 16px 18px 0; }
  .dlg-head h3 { margin: 0; font-size: 17px; flex: 1; }
  .dlg-body { padding: 14px 18px; max-height: 68vh; overflow: auto; }
  .dlg-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 0 18px 16px; flex-wrap: wrap; }
  .dlg-foot .left { margin-right: auto; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .role-row { display: flex; align-items: center; gap: 8px; }
  .role-row input[type=text] { flex: 1 1 auto; min-width: 0; }
  .check { display: flex; align-items: center; gap: 4px; white-space: nowrap;
           font-size: 13px; color: var(--muted); cursor: pointer; }
  .check input { accent-color: var(--accent); width: 16px; height: 16px; }
  .care-tag { margin-left: 6px; font-size: 11px; font-weight: 600; padding: 1px 7px;
              border-radius: 999px; background: var(--accent-soft); color: var(--accent); }

  .visit { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
           margin-bottom: 8px; background: var(--bg); }
  .visit .vhead { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .visit .vhead b { color: var(--text); font-variant-numeric: tabular-nums; }
  .visit p { margin: 4px 0 0; white-space: pre-wrap; font-size: 14px; }

  .add-row { display: flex; gap: 8px; align-items: flex-end; }
  .drow { display: flex; align-items: center; gap: 10px;
          padding: 10px 14px; border-top: 1px solid var(--line); }
  .drow:first-child { border-top: 0; }
  .drow .dname { flex: 1 1 auto; font-weight: 600; }
  .drow .dcount { font-size: 12px; color: var(--muted); }
  .drow { cursor: grab; user-select: none; -webkit-user-select: none; touch-action: pan-y; }
  .drow .grip { color: var(--muted); font-size: 15px; line-height: 1; letter-spacing: -2px; }
  .drow.dragging { cursor: grabbing; background: var(--accent-soft); opacity: .85; }

  .section-title { font-size: 12px; color: var(--muted); margin: 18px 0 8px; }
  hr.sep { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
  .hint { font-size: 12px; color: var(--muted); }

  /* 로그인 화면 */
  #gate { position: fixed; inset: 0; background: var(--bg); display: none;
          align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  #gate.on { display: flex; }
  #gate .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
                box-shadow: var(--shadow); padding: 30px 26px; max-width: 380px; width: 100%;
                text-align: center; }
  #gate h2 { margin: 0 0 6px; font-size: 19px; }
  #gate p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  #gateError { color: var(--lv60); font-size: 13px; margin-top: 14px; min-height: 18px; }

  @media (max-width: 520px) {
    .grid2 { grid-template-columns: 1fr; }
    header.top { gap: 8px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title">
      <h1>교인 심방 관리</h1>
      <p>교인 한 사람 한 사람을 기억하고, 기도하고, 연락하기 위한 페이지입니다.</p>
    </div>
    <div class="head-right">
      <button type="button" id="themeBtn" class="theme" aria-label="화면 색">💻</button>
      <div class="account" id="account" hidden>
        <button class="ghost" id="signOutBtn">로그아웃</button>
      </div>
    </div>
  </header>

  <div class="notice" id="localNotice" hidden>
    <span>구글 로그인이 설정되지 않아 <b>이 브라우저에만</b> 저장됩니다.</span>
    <span class="hint">설정 방법은 README 의 “구글 로그인 · 자료 동기화 설정”을 참고하세요.</span>
  </div>

  <div class="toolbar">
    <div class="grow"><input type="search" id="q" placeholder="이름 · 직분 · 그룹 검색" /></div>
    <select id="levelSelect" style="width:auto"></select>
    <select id="districtFilter" style="width:auto"><option value="">전체 그룹</option></select>
    <button class="primary" id="addBtn">＋ 성도 추가</button>
  </div>

  <div id="board"></div>
</div>

<!-- 로그인 화면 -->
<div id="gate">
  <div class="card">
    <h2>교인 심방 관리</h2>
    <p>교인 한 사람 한 사람을 기억하고 기도하기 위한 페이지입니다.<br />구글 계정으로 로그인해 주세요.</p>
    <button class="primary google" id="signInBtn">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.2 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.2 5.2C39.9 36 44 30.6 44 24c0-1.2-.1-2.4-.4-3.5z"/>
      </svg>
      구글로 로그인
    </button>
    <div id="gateError"></div>
  </div>
</div>

<!-- 성도 추가/수정 -->
<dialog id="memberDlg">
  <form method="dialog" id="memberForm">
    <div class="dlg-head"><h3 id="memberDlgTitle">성도 추가</h3></div>
    <div class="dlg-body">
      <label class="field"><span>이름</span>
        <input type="text" id="mName" required placeholder="예) 김은혜" /></label>
      <div class="grid2">
        <label class="field"><span>직분</span>
          <div class="role-row">
            <input type="text" id="mRole" list="roleList" placeholder="예) 권사" />
            <label class="check" title="더 관심이 필요한 분">
              <input type="checkbox" id="mCare" /> 관심
            </label>
          </div>
          <datalist id="roleList">
            <option value="목사"></option><option value="전도사"></option>
            <option value="장로"></option><option value="권사"></option>
            <option value="안수집사"></option><option value="집사"></option>
            <option value="성도"></option><option value="청년"></option>
            <option value="학생"></option>
          </datalist>
        </label>
        <label class="field"><span>그룹</span>
          <select id="mDistrict"></select>
        </label>
      </div>
      <label class="field"><span>연락처 (선택)</span>
        <input type="text" id="mContact" placeholder="예) 010-0000-0000" /></label>
      <label class="field"><span>기도 제목 · 메모 (선택)</span>
        <textarea id="mMemo" placeholder="계속 기억하고 기도할 내용"></textarea></label>
    </div>
    <div class="dlg-foot">
      <button type="button" class="danger left" id="memberDelete" hidden>삭제</button>
      <button type="button" id="memberCancel">취소</button>
      <button type="submit" class="primary">저장</button>
    </div>
  </form>
</dialog>

<!-- 그룹 편집 -->
<dialog id="districtDlg">
  <div class="dlg-head"><h3>그룹 편집</h3></div>
  <div class="dlg-body">
    <form id="districtAddForm" class="add-row">
      <label class="field" style="flex:1;margin:0"><span>새 그룹 이름</span>
        <input type="text" id="districtNew" placeholder="예) 1그룹" /></label>
      <button type="submit" class="primary">추가</button>
    </form>
    <div class="section-title">그룹 목록 <span class="hint">— 끌어서 순서를 바꿉니다 (휴대폰은 길게 누른 뒤 끌기)</span></div>
    <div id="districtManageList"></div>
  </div>
  <div class="dlg-foot"><button id="districtDlgClose">닫기</button></div>
</dialog>

<!-- 성도 상세 · 심방 기록 -->
<dialog id="detailDlg">
  <div class="dlg-head">
    <h3 id="detailName">이름</h3>
    <button class="ghost" id="detailEdit">정보 수정</button>
  </div>
  <div class="dlg-body">
    <div class="hint" id="detailMeta"></div>
    <div id="detailMemo"></div>

    <hr class="sep" />
    <form id="visitForm">
      <div class="grid2">
        <label class="field"><span>심방 날짜</span>
          <input type="date" id="vDate" required /></label>
        <label class="field"><span>구분 (선택)</span>
          <input type="text" id="vKind" list="kindList" placeholder="예) 가정" />
          <datalist id="kindList">
            <option value="전화"></option><option value="문자"></option>
            <option value="교회"></option><option value="가정"></option>
            <option value="병원"></option>
          </datalist>
        </label>
      </div>
      <label class="field"><span>심방 내용 (선택)</span>
        <textarea id="vNote" placeholder="나눈 이야기, 기도 제목, 이어서 챙길 일"></textarea></label>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button type="button" id="visitCancelEdit" hidden>수정 취소</button>
        <button type="submit" class="primary" id="visitSubmit">심방 기록 추가</button>
      </div>
    </form>

    <div class="section-title">심방 기록 <span id="visitCount"></span></div>
    <div id="visitList"></div>
  </div>
  <div class="dlg-foot">
    <button id="detailClose">닫기</button>
  </div>
</dialog>

<script src="config.js"></script>
<script>
(function () {
  "use strict";

  var LOCAL_KEY = "church-care-v1";
  var CFG = window.CHURCH_CONFIG || {};
  var useCloud = !!(CFG.firebase && CFG.firebase.apiKey && CFG.firebase.projectId);

  var state = { members: [], districts: [] };
  var mode = useCloud ? "cloud" : "local";   // 자료를 어디에 저장하는지
  var cloud = null;                          // { db, docRef, save, ... }
  var editingMemberId = null;
  var openMemberId = null;
  var editingVisitId = null;
  var levelFilter = "";                      // 심방 간격 필터
  var lastFilterValue = "";                  // 그룹 필터에서 마지막으로 고른 값
  var MANAGE_DISTRICT = "__manage__";        // 두 펼침 메뉴의 "그룹 편집" 항목

  var $ = function (id) { return document.getElementById(id); };

  /* ---------- 심방 간격 구간 (20일 / 40일 / 60일 / 기록 없음) ---------- */
  var LEVELS = [
    { key: "lv0",  label: "1일~",   min: 0,  max: 20 },
    { key: "lv20", label: "20일~",  min: 20, max: 40 },
    { key: "lv40", label: "40일~",  min: 40, max: 60 },
    { key: "lv60", label: "60일~",  min: 60, max: Infinity },
    { key: "none", label: "기록없음", min: null, max: null }
  ];
  function careLevel(days) {
    if (days === null) return "none";
    if (days >= 60) return "lv60";
    if (days >= 40) return "lv40";
    if (days >= 20) return "lv20";
    return "lv0";
  }

  /* ---------- 저장소 ---------- */
  function loadLocal() {
    try {
      var raw = localStorage.getItem(LOCAL_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.members)) {
          return { members: parsed.members, districts: parsed.districts };
        }
      }
    } catch (e) { /* 손상된 자료는 무시하고 새로 시작 */ }
    return { members: [], districts: [] };
  }
  function saveLocal() {
    try {
      localStorage.setItem(LOCAL_KEY,
        JSON.stringify({ members: state.members, districts: state.districts }));
    } catch (e) {
      alert("저장에 실패했습니다. 브라우저 저장 공간을 확인해 주세요.");
    }
  }
  function save() {
    if (mode === "cloud" && cloud) cloud.save();
    else saveLocal();
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function normalize(members) {
    return (Array.isArray(members) ? members : []).map(function (m) {
      return {
        id: m.id || uid(),
        name: String(m.name || "").trim(),
        role: String(m.role || "").trim(),
        district: String(m.district || "").trim(),
        contact: String(m.contact || "").trim(),
        memo: String(m.memo || "").trim(),
        care: !!m.care,
        visits: (Array.isArray(m.visits) ? m.visits : []).map(function (v) {
          return { id: v.id || uid(), date: v.date || "", kind: v.kind || "", note: v.note || "" };
        })
      };
    });
  }

  function normalizeDistricts(list) {
    var seen = {}, out = [];
    (Array.isArray(list) ? list : []).forEach(function (d) {
      var name = String(d || "").trim();
      if (name && name !== "미배정" && !seen[name]) { seen[name] = true; out.push(name); }
    });
    return out;
  }

  /* ---------- 날짜 도우미 ---------- */
  function today() {
    var d = new Date();
    return [d.getFullYear(),
            String(d.getMonth() + 1).padStart(2, "0"),
            String(d.getDate()).padStart(2, "0")].join("-");
  }
  function daysSince(dateStr) {
    if (!dateStr) return null;
    var a = new Date(dateStr + "T00:00:00");
    var b = new Date(today() + "T00:00:00");
    if (isNaN(a)) return null;
    return Math.round((b - a) / 86400000);
  }
  function formatDate(dateStr) {
    var p = (dateStr || "").split("-");
    return p.length === 3 ? p[0] + "." + p[1] + "." + p[2] : dateStr;
  }
  function lastVisit(m) {
    if (!m.visits || !m.visits.length) return null;
    return m.visits.slice().sort(function (a, b) {
      return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
    })[0];
  }
  function memberLevel(m) {
    var lv = lastVisit(m);
    return careLevel(lv ? daysSince(lv.date) : null);
  }
  function badgeText(days) {
    if (days === null) return "기록 없음";
    if (days === 0) return "오늘";
    if (days === 1) return "어제";
    return days + "일 전";
  }

  /* ---------- 화면 그리기 ---------- */
  // 교인이 속한 그룹 중 목록에 없는 것을 뒤에 채워 넣는다 (순서를 늘 정할 수 있도록)
  function syncDistricts() {
    var known = {};
    (state.districts || []).forEach(function (d) { known[d] = true; });

    var extra = [];
    state.members.forEach(function (m) {
      var d = (m.district || "").trim();
      if (d && !known[d]) { known[d] = true; extra.push(d); }
    });
    extra.sort(function (a, b) { return a.localeCompare(b, "ko"); });
    state.districts = (state.districts || []).concat(extra);
  }

  // 저장된 순서대로, 소속이 없는 교인이 있으면 미배정을 맨 뒤에
  function districts() {
    var list = (state.districts || []).slice();
    var hasNone = state.members.some(function (m) { return !(m.district || "").trim(); });
    if (hasNone) list.push("미배정");
    return list;
  }

  function render() {
    renderLevelSelect();
    renderDistrictOptions();
    renderBoard();
  }

  function levelCounts() {
    var counts = {};
    LEVELS.forEach(function (l) { counts[l.key] = 0; });
    state.members.forEach(function (m) { counts[memberLevel(m)]++; });
    return counts;
  }

  function renderLevelSelect(counts) {
    counts = counts || levelCounts();
    var sel = $("levelSelect");
    sel.innerHTML = "";

    var all = document.createElement("option");
    all.value = ""; all.textContent = "심방간격 (" + state.members.length + ")";
    sel.appendChild(all);

    LEVELS.forEach(function (l) {
      var o = document.createElement("option");
      o.value = l.key;
      o.textContent = l.label + " (" + counts[l.key] + ")";
      sel.appendChild(o);
    });
    sel.value = levelFilter;
  }

  function renderDistrictOptions() {
    var list = districts();
    var sel = $("districtFilter");
    var cur = sel.value;
    sel.innerHTML = '<option value="">전체 그룹</option>';
    list.forEach(function (d) {
      var o = document.createElement("option");
      o.value = d; o.textContent = d;
      sel.appendChild(o);
    });
    var edit = document.createElement("option");
    edit.value = MANAGE_DISTRICT; edit.textContent = "⚙ 그룹 편집…";
    sel.appendChild(edit);

    sel.value = list.indexOf(cur) >= 0 ? cur : "";
    lastFilterValue = sel.value;
  }

  /* 성도 창의 그룹 펼침 메뉴 — 등록된 그룹 + 그룹 관리 열기 */
  var lastDistrictValue = "";

  function fillDistrictSelect(current) {
    var sel = $("mDistrict");
    var list = districts().filter(function (d) { return d !== "미배정"; });
    if (current && list.indexOf(current) < 0) list.push(current);

    sel.innerHTML = "";
    var blank = document.createElement("option");
    blank.value = ""; blank.textContent = "미배정";
    sel.appendChild(blank);

    list.forEach(function (d) {
      var o = document.createElement("option");
      o.value = d; o.textContent = d;
      sel.appendChild(o);
    });

    var manage = document.createElement("option");
    manage.value = MANAGE_DISTRICT; manage.textContent = "⚙ 그룹 편집…";
    sel.appendChild(manage);

    sel.value = current || "";
    lastDistrictValue = sel.value;
  }

  function selectedDistrict() {
    var value = $("mDistrict").value;
    return value === MANAGE_DISTRICT ? lastDistrictValue : value;
  }

  function matches(m, q) {
    if (!q) return true;
    return [m.name, m.role, m.district, m.contact, m.memo].join(" ").toLowerCase().indexOf(q) >= 0;
  }

  function renderBoard() {
    var board = $("board");
    var q = $("q").value.trim().toLowerCase();
    var filter = $("districtFilter").value;
    board.innerHTML = "";

    if (!state.members.length) {
      board.innerHTML =
        '<div class="empty">아직 등록된 성도가 없습니다.<br />' +
        '위의 <b>＋ 성도 추가</b> 로 교인을 등록해 주세요.</div>';
      return;
    }

    var shown = 0;
    districts().forEach(function (d) {
      if (filter && d !== filter) return;
      var members = state.members.filter(function (m) {
        if (((m.district || "").trim() || "미배정") !== d) return false;
        if (levelFilter && memberLevel(m) !== levelFilter) return false;
        return matches(m, q);
      });
      // 성도가 아직 없는 그룹도, 걸러 보는 중이 아니라면 자리를 보여 준다
      var plain = !q && !levelFilter;
      if (!members.length && !(plain && (state.districts || []).indexOf(d) >= 0)) return;

      // 심방이 오래된 순으로 — 먼저 챙겨야 할 분이 위로
      members.sort(function (a, b) {
        var la = lastVisit(a), lb = lastVisit(b);
        if (!la && !lb) return a.name.localeCompare(b.name, "ko");
        if (!la) return -1;
        if (!lb) return 1;
        return la.date < lb.date ? -1 : la.date > lb.date ? 1 : 0;
      });
      shown += members.length;

      var wrap = document.createElement("section");
      wrap.className = "district";

      var h2 = document.createElement("h2");
      h2.textContent = d;
      var small = document.createElement("small");
      small.textContent = members.length + "명";
      h2.appendChild(small);
      wrap.appendChild(h2);

      var list = document.createElement("div");
      list.className = "list";
      if (members.length) {
        members.forEach(function (m) { list.appendChild(memberRow(m)); });
      } else {
        var empty = document.createElement("div");
        empty.className = "empty";
        empty.style.padding = "18px 14px";
        empty.textContent = "아직 이 그룹에 등록된 성도가 없습니다.";
        list.appendChild(empty);
      }
      wrap.appendChild(list);
      board.appendChild(wrap);
    });

    if (!shown && !board.children.length) {
      board.innerHTML = '<div class="empty">해당하는 성도가 없습니다.</div>';
    }
  }

  function memberRow(m) {
    var lv = lastVisit(m);
    var days = lv ? daysSince(lv.date) : null;
    var level = careLevel(days);

    var row = document.createElement("div");
    row.className = "row";

    var main = document.createElement("button");
    main.type = "button";
    main.className = "row-main";
    main.addEventListener("click", function () { openDetail(m.id); });

    var who = document.createElement("div");
    who.className = "who";

    var name = document.createElement("div");
    name.className = "name";
    name.textContent = m.name;
    if (m.role) {
      var role = document.createElement("span");
      role.className = "role";
      role.textContent = m.role;
      name.appendChild(role);
    }
    who.appendChild(name);

    // 첫 줄에 최근 심방 날짜와 구분을 이어 붙인다
    if (lv) {
      var when = document.createElement("span");
      when.className = "when";
      when.textContent = formatDate(lv.date) + (lv.kind ? " · " + lv.kind : "");
      name.appendChild(when);
    }

    // 둘째 줄은 심방 내용
    var last = document.createElement("div");
    last.className = "last";
    last.textContent = lv
      ? (lv.note ? lv.note.replace(/\s+/g, " ") : "")
      : "심방 기록이 없습니다";
    who.appendChild(last);
    main.appendChild(who);
    row.appendChild(main);

    var badge = document.createElement("span");
    badge.className = "badge " + level;
    badge.textContent = badgeText(days);
    row.appendChild(badge);

    // 홈 화면에서 바로 관심 표시를 켜고 끈다
    var care = document.createElement("button");
    care.type = "button";
    care.className = "care-btn";
    care.textContent = m.care ? "♥" : "♡";
    care.title = m.care ? "관심 해제" : "관심 표시";
    care.setAttribute("aria-label", m.name + " 관심 표시");
    care.setAttribute("aria-pressed", String(!!m.care));
    care.addEventListener("click", function () { toggleCare(m.id); });
    row.appendChild(care);

    return row;
  }

  function toggleCare(id) {
    var m = findMember(id);
    if (!m) return;
    m.care = !m.care;
    save();
    render();
    if (openMemberId === id) renderDetail();
  }

  /* ---------- 성도 추가 / 수정 ---------- */
  function findMember(id) {
    for (var i = 0; i < state.members.length; i++) {
      if (state.members[i].id === id) return state.members[i];
    }
    return null;
  }

  function openMemberDlg(id) {
    editingMemberId = id || null;
    var m = id ? findMember(id) : null;
    $("memberDlgTitle").textContent = m ? "성도 정보 수정" : "성도 추가";
    $("mName").value = m ? m.name : "";
    $("mRole").value = m ? (m.role || "") : "";
    fillDistrictSelect(m ? (m.district || "") : ($("districtFilter").value || ""));
    $("mCare").checked = m ? !!m.care : false;
    $("mContact").value = m ? (m.contact || "") : "";
    $("mMemo").value = m ? (m.memo || "") : "";
    $("memberDelete").hidden = !m;
    $("memberDlg").showModal();
    $("mName").focus();
  }

  $("memberForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("mName").value.trim();
    if (!name) return;
    var data = {
      name: name,
      role: $("mRole").value.trim(),
      district: selectedDistrict(),
      care: $("mCare").checked,
      contact: $("mContact").value.trim(),
      memo: $("mMemo").value.trim()
    };
    if (editingMemberId) {
      var m = findMember(editingMemberId);
      if (m) { Object.keys(data).forEach(function (k) { m[k] = data[k]; }); }
    } else {
      data.id = uid();
      data.visits = [];
      state.members.push(data);
    }
    save();
    render();
    $("memberDlg").close();
    if (openMemberId) renderDetail();
  });

  $("mDistrict").addEventListener("change", function () {
    var sel = $("mDistrict");
    if (sel.value === MANAGE_DISTRICT) {
      sel.value = lastDistrictValue;     // 관리 창을 열고 고른 값은 되돌림
      openDistrictDlg();
      return;
    }
    lastDistrictValue = sel.value;
  });

  $("memberCancel").addEventListener("click", function () { $("memberDlg").close(); });

  $("memberDelete").addEventListener("click", function () {
    var m = findMember(editingMemberId);
    if (!m) return;
    if (!confirm(m.name + " 님의 정보와 심방 기록을 모두 삭제할까요?")) return;
    state.members = state.members.filter(function (x) { return x.id !== m.id; });
    save();
    $("memberDlg").close();
    if (openMemberId === m.id) { $("detailDlg").close(); openMemberId = null; }
    render();
  });

  /* ---------- 그룹 편집 ---------- */
  function memberDlgOpen() { return $("memberDlg").open; }

  function openDistrictDlg() {
    $("districtNew").value = "";
    renderDistrictManage();
    $("districtDlg").showModal();
    $("districtNew").focus();
  }

  function countInDistrict(name) {
    return state.members.filter(function (m) {
      return (m.district || "").trim() === name;
    }).length;
  }

  function renderDistrictManage() {
    var list = (state.districts || []).slice();
    var box = $("districtManageList");
    box.innerHTML = "";

    if (!list.length) {
      var empty = document.createElement("p");
      empty.className = "hint";
      empty.textContent = "아직 그룹이 없습니다. 위에서 추가해 주세요.";
      box.appendChild(empty);
      return;
    }

    var wrap = document.createElement("div");
    wrap.className = "list";
    list.forEach(function (d) {
      var row = document.createElement("div");
      row.className = "drow";
      row.dataset.name = d;

      var grip = document.createElement("span");
      grip.className = "grip";
      grip.textContent = "⠿";
      grip.setAttribute("aria-hidden", "true");
      row.appendChild(grip);

      var name = document.createElement("span");
      name.className = "dname";
      name.textContent = d;
      row.appendChild(name);

      var count = document.createElement("span");
      count.className = "dcount";
      count.textContent = countInDistrict(d) + "명";
      row.appendChild(count);

      var del = document.createElement("button");
      del.type = "button"; del.className = "ghost"; del.textContent = "삭제";
      del.addEventListener("click", function () { deleteDistrict(d); });
      row.appendChild(del);

      makeDraggable(row);
      wrap.appendChild(row);
    });
    box.appendChild(wrap);
  }

  /* 끌어서 순서 바꾸기 — 마우스는 바로, 휴대폰은 길게 누른 뒤 */
  var LONG_PRESS_MS = 350;
  var drag = null;

  function makeDraggable(row) {
    row.addEventListener("pointerdown", function (e) {
      if (e.target.closest("button")) return;   // 삭제 단추는 그대로 눌리게
      if (e.button !== undefined && e.button !== 0) return;

      drag = {
        row: row,
        startY: e.clientY,
        active: false,
        touch: e.pointerType === "touch",
        timer: null
      };
      row.setPointerCapture(e.pointerId);

      if (drag.touch) {
        drag.timer = setTimeout(function () {
          if (drag) activateDrag();
        }, LONG_PRESS_MS);
      }
    });

    row.addEventListener("pointermove", function (e) {
      if (!drag) return;

      if (!drag.active) {
        var moved = Math.abs(e.clientY - drag.startY);
        if (drag.touch) {
          if (moved > 10) clearDrag();          // 목록을 넘기려는 손짓이면 취소
        } else if (moved > 4) {
          activateDrag();                        // 마우스는 조금만 움직여도 시작
        }
        return;
      }

      var wrap = drag.row.parentElement;
      if (!wrap) return;
      var after = rowAfter(wrap, e.clientY);
      if (after !== drag.row) wrap.insertBefore(drag.row, after);
    });

    row.addEventListener("pointerup", finishDrag);
    row.addEventListener("pointercancel", finishDrag);
  }

  function activateDrag() {
    drag.active = true;
    drag.row.classList.add("dragging");
  }

  function clearDrag() {
    if (!drag) return;
    if (drag.timer) clearTimeout(drag.timer);
    drag.row.classList.remove("dragging");
    drag = null;
  }

  // 손가락·포인터 위치에 따라 어느 줄 앞에 놓을지 고른다
  function rowAfter(wrap, y) {
    var rows = [].slice.call(wrap.querySelectorAll(".drow:not(.dragging)"));
    for (var i = 0; i < rows.length; i++) {
      var box = rows[i].getBoundingClientRect();
      if (y < box.top + box.height / 2) return rows[i];
    }
    return null;
  }

  function finishDrag() {
    if (!drag) return;
    var wasActive = drag.active;
    var wrap = drag.row.parentElement;
    clearDrag();
    if (!wasActive || !wrap) return;

    state.districts = [].slice.call(wrap.querySelectorAll(".drow"))
      .map(function (r) { return r.dataset.name; });
    save();
    render();
    renderDistrictManage();
    if (memberDlgOpen()) fillDistrictSelect(selectedDistrict());
  }

  // 끄는 중에는 화면이 함께 밀리지 않도록
  document.addEventListener("touchmove", function (e) {
    if (drag && drag.active) e.preventDefault();
  }, { passive: false });

  function addDistrict(name) {
    name = String(name || "").trim();
    if (!name) return false;
    if (name === "미배정") { alert("‘미배정’ 은 그룹 이름으로 쓸 수 없습니다."); return false; }
    if (districts().indexOf(name) >= 0) { alert("이미 있는 그룹입니다."); return false; }
    state.districts.push(name);
    save();
    render();
    renderDistrictManage();
    return true;
  }

  // 이름 끝소리에 맞춰 을/를 을 고른다
  function objectParticle(word) {
    var code = word.charCodeAt(word.length - 1);
    if (code < 0xAC00 || code > 0xD7A3) return "을(를)";
    return ((code - 0xAC00) % 28) ? "을" : "를";
  }

  function deleteDistrict(name) {
    var n = countInDistrict(name);
    var msg = n
      ? "‘" + name + "’" + objectParticle(name) + " 지우면 이 그룹의 " + n + "명이 미배정으로 옮겨집니다. 계속할까요?"
      : "‘" + name + "’ 그룹을 지울까요?";
    if (!confirm(msg)) return;

    state.districts = (state.districts || []).filter(function (d) { return d !== name; });
    state.members.forEach(function (m) {
      if ((m.district || "").trim() === name) m.district = "";
    });
    save();
    render();
    renderDistrictManage();
    if (memberDlgOpen()) fillDistrictSelect(selectedDistrict() === name ? "" : selectedDistrict());
    if (openMemberId) renderDetail();
  }

  $("districtDlgClose").addEventListener("click", function () { $("districtDlg").close(); });

  $("districtAddForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("districtNew").value.trim();
    if (!addDistrict(name)) return;
    $("districtNew").value = "";
    $("districtNew").focus();
    // 성도 창에서 열었다면 방금 만든 그룹을 골라 둔다
    if (memberDlgOpen()) fillDistrictSelect(name);
  });

  /* ---------- 상세 · 심방 기록 ---------- */
  function openDetail(id) {
    openMemberId = id;
    editingVisitId = null;
    resetVisitForm();
    renderDetail();
    $("detailDlg").showModal();
  }

  function resetVisitForm() {
    $("vDate").value = today();
    $("vKind").value = "";
    $("vNote").value = "";
    $("visitSubmit").textContent = editingVisitId ? "심방 기록 저장" : "심방 기록 추가";
    $("visitCancelEdit").hidden = !editingVisitId;
  }

  function renderDetail() {
    var m = findMember(openMemberId);
    if (!m) { $("detailDlg").close(); return; }

    $("detailName").textContent = m.name + (m.role ? " " + m.role : "");
    if (m.care) {
      var careTag = document.createElement("span");
      careTag.className = "care-tag";
      careTag.textContent = "관심";
      $("detailName").appendChild(careTag);
    }

    var meta = [(m.district || "미배정")];
    if (m.contact) meta.push(m.contact);
    var lv = lastVisit(m);
    meta.push(lv ? "최근 심방 " + formatDate(lv.date) + " (" + badgeText(daysSince(lv.date)) + ")"
                 : "심방 기록 없음");
    $("detailMeta").textContent = meta.join(" · ");

    var memoBox = $("detailMemo");
    memoBox.innerHTML = "";
    if (m.memo) {
      var p = document.createElement("p");
      p.style.whiteSpace = "pre-wrap";
      p.style.margin = "8px 0 0";
      p.style.fontSize = "14px";
      p.textContent = m.memo;
      memoBox.appendChild(p);
    }

    var visits = (m.visits || []).slice().sort(function (a, b) {
      return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
    });
    $("visitCount").textContent = visits.length ? "(" + visits.length + "회)" : "";

    var list = $("visitList");
    list.innerHTML = "";
    if (!visits.length) {
      var empty = document.createElement("p");
      empty.className = "hint";
      empty.textContent = "아직 기록이 없습니다. 위에서 첫 심방을 기록해 주세요.";
      list.appendChild(empty);
      return;
    }
    visits.forEach(function (v) {
      var box = document.createElement("div");
      box.className = "visit";

      var head = document.createElement("div");
      head.className = "vhead";
      var b = document.createElement("b");
      b.textContent = formatDate(v.date);
      head.appendChild(b);
      if (v.kind) {
        var kind = document.createElement("span");
        kind.textContent = "· " + v.kind;
        head.appendChild(kind);
      }
      var spacer = document.createElement("span");
      spacer.style.flex = "1";
      head.appendChild(spacer);

      var edit = document.createElement("button");
      edit.type = "button"; edit.className = "ghost"; edit.textContent = "수정";
      edit.addEventListener("click", function () { startEditVisit(v.id); });
      head.appendChild(edit);

      var del = document.createElement("button");
      del.type = "button"; del.className = "ghost"; del.textContent = "삭제";
      del.addEventListener("click", function () { deleteVisit(v.id); });
      head.appendChild(del);

      box.appendChild(head);

      if (v.note) {
        var p = document.createElement("p");
        p.textContent = v.note;
        box.appendChild(p);
      }
      list.appendChild(box);
    });
  }

  function startEditVisit(visitId) {
    var m = findMember(openMemberId);
    if (!m) return;
    var v = (m.visits || []).filter(function (x) { return x.id === visitId; })[0];
    if (!v) return;
    editingVisitId = visitId;
    $("vDate").value = v.date;
    $("vKind").value = v.kind || "";
    $("vNote").value = v.note || "";
    $("visitSubmit").textContent = "심방 기록 저장";
    $("visitCancelEdit").hidden = false;
    $("vNote").focus();
  }

  function deleteVisit(visitId) {
    var m = findMember(openMemberId);
    if (!m) return;
    if (!confirm("이 심방 기록을 삭제할까요?")) return;
    m.visits = (m.visits || []).filter(function (x) { return x.id !== visitId; });
    if (editingVisitId === visitId) editingVisitId = null;
    save();
    resetVisitForm();
    renderDetail();
    render();
  }

  $("visitForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var m = findMember(openMemberId);
    if (!m) return;
    var date = $("vDate").value;
    var note = $("vNote").value.trim();
    if (!date) return;
    if (!m.visits) m.visits = [];

    if (editingVisitId) {
      var v = m.visits.filter(function (x) { return x.id === editingVisitId; })[0];
      if (v) { v.date = date; v.kind = $("vKind").value.trim(); v.note = note; }
      editingVisitId = null;
    } else {
      m.visits.push({ id: uid(), date: date, kind: $("vKind").value.trim(), note: note });
    }
    save();
    resetVisitForm();
    renderDetail();
    render();
  });

  $("visitCancelEdit").addEventListener("click", function () {
    editingVisitId = null;
    resetVisitForm();
  });

  $("detailEdit").addEventListener("click", function () { openMemberDlg(openMemberId); });
  $("detailClose").addEventListener("click", function () { $("detailDlg").close(); });
  $("detailDlg").addEventListener("close", function () { openMemberId = null; editingVisitId = null; });

  /* ---------- 이벤트 ---------- */
  $("addBtn").addEventListener("click", function () { openMemberDlg(null); });
  $("levelSelect").addEventListener("change", function () {
    levelFilter = $("levelSelect").value;
    renderBoard();
  });

  $("q").addEventListener("input", renderBoard);
  $("districtFilter").addEventListener("change", function () {
    var sel = $("districtFilter");
    if (sel.value === MANAGE_DISTRICT) {
      sel.value = lastFilterValue;      // 편집 창을 열고 고른 값은 되돌림
      openDistrictDlg();
      return;
    }
    lastFilterValue = sel.value;
    renderBoard();
  });

  /* ---------- 화면 색 ---------- */
  var THEME_KEY = "church-care-theme";

  function applyTheme(value) {
    if (value === "light" || value === "dark") {
      document.documentElement.setAttribute("data-theme", value);
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
  }

  // 누를 때마다 시스템 설정 → 밝게 → 어둡게 순으로 돌아간다
  var THEMES = [
    { value: "auto",  emoji: "💻", label: "시스템 설정" },
    { value: "light", emoji: "☀️", label: "밝게" },
    { value: "dark",  emoji: "🌙", label: "어둡게" }
  ];
  var themeIndex = 0;

  function showTheme(i) {
    var t = THEMES[i];
    var next = THEMES[(i + 1) % THEMES.length];
    $("themeBtn").textContent = t.emoji;
    $("themeBtn").title = "화면 색: " + t.label + " (누르면 " + next.label + ")";
  }

  (function initTheme() {
    var saved = "auto";
    try { saved = localStorage.getItem(THEME_KEY) || "auto"; } catch (e) { /* 무시 */ }
    themeIndex = 0;
    THEMES.forEach(function (t, i) { if (t.value === saved) themeIndex = i; });
    applyTheme(THEMES[themeIndex].value);
    showTheme(themeIndex);
  })();

  $("themeBtn").addEventListener("click", function () {
    themeIndex = (themeIndex + 1) % THEMES.length;
    var value = THEMES[themeIndex].value;
    applyTheme(value);
    showTheme(themeIndex);
    try { localStorage.setItem(THEME_KEY, value); } catch (e) { /* 무시 */ }
  });

  /* ---------- 구글 로그인 · 클라우드 저장 ---------- */
  function showGate(show) { $("gate").classList.toggle("on", !!show); }
  function gateError(msg) { $("gateError").textContent = msg || ""; }

  function startLocalMode() {
    mode = "local";
    var stored = loadLocal();
    state = { members: normalize(stored.members), districts: normalizeDistricts(stored.districts) };
    syncDistricts();
    $("localNotice").hidden = false;
    showGate(false);
    render();
  }

  function startCloudMode() {
    showGate(true);
    var V = CFG.firebaseVersion || "11.6.0";
    var base = "https://www.gstatic.com/firebasejs/" + V + "/";

    Promise.all([
      import(base + "firebase-app.js"),
      import(base + "firebase-auth.js"),
      import(base + "firebase-firestore.js")
    ]).then(function (mods) {
      var appMod = mods[0], authMod = mods[1], fsMod = mods[2];
      var app = appMod.initializeApp(CFG.firebase);
      var auth = authMod.getAuth(app);
      var db = fsMod.getFirestore(app);
      var provider = new authMod.GoogleAuthProvider();

      $("signInBtn").addEventListener("click", function () {
        gateError("");
        authMod.signInWithPopup(auth, provider).catch(function (err) {
          if (err && /popup/.test(err.code || "")) {
            authMod.signInWithRedirect(auth, provider);
          } else {
            gateError(authMessage(err));
          }
        });
      });
      $("signOutBtn").addEventListener("click", function () { authMod.signOut(auth); });

      authMod.getRedirectResult(auth).catch(function (err) { gateError(authMessage(err)); });

      authMod.onAuthStateChanged(auth, function (user) {
        if (cloud && cloud.unsub) { cloud.unsub(); cloud = null; }

        if (!user) {
          state = { members: [], districts: [] };
          $("account").hidden = true;
          render();
          showGate(true);
          return;
        }

        var allow = CFG.allowedEmails;
        if (Array.isArray(allow) && allow.length &&
            allow.map(String).map(function (s) { return s.toLowerCase(); })
                 .indexOf((user.email || "").toLowerCase()) < 0) {
          gateError((user.email || "이 계정") + " 은 접근이 허용되지 않았습니다. 담당자에게 문의해 주세요.");
          authMod.signOut(auth);
          return;
        }

        $("account").hidden = false;
        gateError("");
        connectDoc(fsMod, db, user);
      });
    }).catch(function () {
      gateError("로그인 모듈을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");
    });
  }

  function connectDoc(fsMod, db, user) {
    var spaceId = CFG.spaceId || ("user-" + user.uid);
    var ref = fsMod.doc(db, "spaces", spaceId);
    var timer = null;
    var firstLoad = true;

    var writeNow = function () {
      fsMod.setDoc(ref, {
        members: state.members,
        districts: state.districts,
        updatedAt: new Date().toISOString(),
        updatedBy: user.email || user.uid
      }).catch(function (err) {
        alert("저장에 실패했습니다: " + (err && err.message ? err.message : err));
      });
    };

    cloud = {
      save: function () {
        if (timer) clearTimeout(timer);
        timer = setTimeout(writeNow, 400);
      },
      unsub: null
    };

    cloud.unsub = fsMod.onSnapshot(ref, function (snap) {
      if (snap.metadata.hasPendingWrites) return;   // 내가 방금 쓴 내용
      var data = snap.exists() ? snap.data() : null;

      if (firstLoad) {
        firstLoad = false;
        var stored = loadLocal();
        var local = normalize(stored.members);
        if ((!data || !data.members || !data.members.length) && local.length) {
          if (confirm("이 브라우저에 저장된 " + local.length + "명의 자료가 있습니다. 구글 계정으로 옮길까요?")) {
            state.members = local;
            state.districts = normalizeDistricts(stored.districts);
            syncDistricts();
            writeNow();
            showGate(false);
            render();
            return;
          }
        }
      }
      state.members = normalize(data ? data.members : []);
      state.districts = normalizeDistricts(data ? data.districts : []);
      syncDistricts();
      showGate(false);
      render();
    }, function (err) {
      gateError("자료를 불러오지 못했습니다: " + (err && err.message ? err.message : err));
      showGate(true);
    });
  }

  function authMessage(err) {
    if (!err) return "";
    var code = err.code || "";
    if (code === "auth/unauthorized-domain")
      return "이 주소는 Firebase 승인된 도메인에 등록되어 있지 않습니다.";
    if (code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request")
      return "";
    return "로그인에 실패했습니다: " + (err.message || code);
  }

  if (useCloud) startCloudMode();
  else startLocalMode();
})();
</script>
</body>
</html>
