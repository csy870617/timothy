<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>교구·구역 심방 관리</title>
<style>
  :root {
    --bg: #f6f4ef;
    --panel: #ffffff;
    --line: #e3ded4;
    --text: #2b2722;
    --muted: #7d766c;
    --accent: #6b5b95;
    --accent-soft: #efeaf7;
    --ok: #2f7d59;
    --ok-soft: #e4f2ea;
    --warn: #a5701c;
    --warn-soft: #faf0dd;
    --late: #a8443a;
    --late-soft: #fae8e5;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1917;
      --panel: #242120;
      --line: #38332f;
      --text: #ece7e0;
      --muted: #a49c92;
      --accent: #a794d6;
      --accent-soft: #322b44;
      --ok: #7dc9a3;
      --ok-soft: #23342c;
      --warn: #d8ac5e;
      --warn-soft: #38301f;
      --late: #e79187;
      --late-soft: #3a2724;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic",
                 "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 940px; margin: 0 auto; padding: 24px 16px 80px; }

  header.top { margin-bottom: 20px; }
  header.top h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.02em; }
  header.top p { margin: 0; color: var(--muted); font-size: 14px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px;
  }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  .stat.late b { color: var(--late); }
  .stat.warn b { color: var(--warn); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .toolbar .grow { flex: 1 1 180px; }

  input, select, textarea, button {
    font: inherit; color: inherit;
  }
  input[type=text], input[type=date], input[type=search], select, textarea {
    width: 100%; padding: 9px 11px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 84px; }
  label.field { display: block; margin-bottom: 10px; }
  label.field > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }

  button {
    cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); padding: 9px 14px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 6px 8px; }
  button.ghost:hover { color: var(--text); background: var(--bg); }
  button.danger:hover { border-color: var(--late); color: var(--late); }

  .district { margin-bottom: 22px; }
  .district > h2 {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 15px; margin: 0 0 8px 2px; letter-spacing: -.01em;
  }
  .district > h2 small { font-weight: 400; color: var(--muted); font-size: 12px; }

  .list { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
          box-shadow: var(--shadow); overflow: hidden; }
  .row {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 12px 14px; background: none; border: 0; border-top: 1px solid var(--line);
    text-align: left; border-radius: 0;
  }
  .row:first-child { border-top: 0; }
  .row:hover { background: var(--bg); }
  .row .who { flex: 1 1 auto; min-width: 0; }
  .row .name { font-weight: 600; }
  .row .role { color: var(--muted); font-size: 12px; margin-left: 6px; font-weight: 400; }
  .row .last { font-size: 12px; color: var(--muted); margin-top: 1px;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .badge {
    flex: 0 0 auto; font-size: 12px; padding: 3px 9px; border-radius: 999px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.late { background: var(--late-soft); color: var(--late); }
  .badge.none { background: var(--accent-soft); color: var(--accent); }

  .empty { text-align: center; color: var(--muted); padding: 44px 16px; font-size: 14px; }

  dialog {
    border: 1px solid var(--line); border-radius: 16px; padding: 0; width: min(520px, calc(100vw - 24px));
    background: var(--panel); color: var(--text); box-shadow: var(--shadow);
  }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .dlg-head { display: flex; align-items: center; gap: 8px; padding: 16px 18px 0; }
  .dlg-head h3 { margin: 0; font-size: 17px; flex: 1; }
  .dlg-body { padding: 14px 18px; max-height: 68vh; overflow: auto; }
  .dlg-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 0 18px 16px; flex-wrap: wrap; }
  .dlg-foot .left { margin-right: auto; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .visit {
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
    background: var(--bg);
  }
  .visit .vhead { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .visit .vhead b { color: var(--text); font-variant-numeric: tabular-nums; }
  .visit p { margin: 4px 0 0; white-space: pre-wrap; font-size: 14px; }

  .section-title { font-size: 12px; color: var(--muted); margin: 18px 0 8px; }
  hr.sep { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
  .hint { font-size: 12px; color: var(--muted); }
  @media (max-width: 520px) {
    .stats { grid-template-columns: 1fr 1fr 1fr; }
    .stat b { font-size: 18px; }
    .grid2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>교구 · 구역 심방 관리</h1>
    <p>구역 식구 한 사람 한 사람을 기억하고, 기도하고, 연락하기 위한 페이지입니다.</p>
  </header>

  <div class="stats">
    <div class="stat"><b id="statTotal">0</b><span>전체 인원</span></div>
    <div class="stat warn"><b id="statWarn">0</b><span>60일 이상 미심방</span></div>
    <div class="stat late"><b id="statLate">0</b><span>90일 이상 · 기록 없음</span></div>
  </div>

  <div class="toolbar">
    <div class="grow"><input type="search" id="q" placeholder="이름 · 직분 · 구역 검색" /></div>
    <select id="districtFilter" style="width:auto"><option value="">전체 구역</option></select>
    <button class="primary" id="addBtn">＋ 성도 추가</button>
    <button id="exportBtn">내보내기</button>
    <button id="importBtn">가져오기</button>
    <input type="file" id="importFile" accept="application/json" hidden />
  </div>

  <div id="board"></div>
</div>

<!-- 성도 추가/수정 -->
<dialog id="memberDlg">
  <form method="dialog" id="memberForm">
    <div class="dlg-head"><h3 id="memberDlgTitle">성도 추가</h3></div>
    <div class="dlg-body">
      <label class="field"><span>이름</span>
        <input type="text" id="mName" required placeholder="예) 김은혜" /></label>
      <div class="grid2">
        <label class="field"><span>직분</span>
          <input type="text" id="mRole" list="roleList" placeholder="예) 권사" />
          <datalist id="roleList">
            <option value="목사"></option><option value="전도사"></option>
            <option value="장로"></option><option value="권사"></option>
            <option value="안수집사"></option><option value="집사"></option>
            <option value="성도"></option><option value="청년"></option>
            <option value="학생"></option>
          </datalist>
        </label>
        <label class="field"><span>구역</span>
          <input type="text" id="mDistrict" list="districtList" placeholder="예) 1구역" />
          <datalist id="districtList"></datalist>
        </label>
      </div>
      <label class="field"><span>연락처 (선택)</span>
        <input type="text" id="mContact" placeholder="예) 010-0000-0000" /></label>
      <label class="field"><span>기도 제목 · 메모 (선택)</span>
        <textarea id="mMemo" placeholder="계속 기억하고 기도할 내용"></textarea></label>
    </div>
    <div class="dlg-foot">
      <button type="button" class="danger left" id="memberDelete" hidden>삭제</button>
      <button type="button" id="memberCancel">취소</button>
      <button type="submit" class="primary">저장</button>
    </div>
  </form>
</dialog>

<!-- 성도 상세 · 심방 기록 -->
<dialog id="detailDlg">
  <div class="dlg-head">
    <h3 id="detailName">이름</h3>
    <button class="ghost" id="detailEdit">정보 수정</button>
  </div>
  <div class="dlg-body">
    <div class="hint" id="detailMeta"></div>
    <div id="detailMemo"></div>

    <hr class="sep" />
    <form id="visitForm">
      <div class="grid2">
        <label class="field"><span>심방 날짜</span>
          <input type="date" id="vDate" required /></label>
        <label class="field"><span>구분 (선택)</span>
          <input type="text" id="vKind" list="kindList" placeholder="예) 가정심방" />
          <datalist id="kindList">
            <option value="가정심방"></option><option value="병원심방"></option>
            <option value="전화심방"></option><option value="문자·카톡"></option>
            <option value="교회 면담"></option><option value="경조사"></option>
          </datalist>
        </label>
      </div>
      <label class="field"><span>심방 내용</span>
        <textarea id="vNote" required placeholder="나눈 이야기, 기도 제목, 이어서 챙길 일"></textarea></label>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button type="button" id="visitCancelEdit" hidden>수정 취소</button>
        <button type="submit" class="primary" id="visitSubmit">심방 기록 추가</button>
      </div>
    </form>

    <div class="section-title">심방 기록 <span id="visitCount"></span></div>
    <div id="visitList"></div>
  </div>
  <div class="dlg-foot">
    <button id="detailClose">닫기</button>
  </div>
</dialog>

<script>
(function () {
  "use strict";

  var KEY = "church-care-v1";
  var state = load();
  var editingMemberId = null;   // 성도 추가/수정 대상
  var openMemberId = null;      // 상세 화면에 열린 성도
  var editingVisitId = null;    // 수정 중인 심방 기록

  var $ = function (id) { return document.getElementById(id); };

  /* ---------- 저장소 ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.members)) return parsed;
      }
    } catch (e) { /* 손상된 데이터는 무시하고 새로 시작 */ }
    return { members: [] };
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      alert("저장에 실패했습니다. 브라우저 저장 공간을 확인해 주세요.");
    }
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  /* ---------- 날짜 도우미 ---------- */
  function today() {
    var d = new Date();
    return [d.getFullYear(),
            String(d.getMonth() + 1).padStart(2, "0"),
            String(d.getDate()).padStart(2, "0")].join("-");
  }
  function daysSince(dateStr) {
    if (!dateStr) return null;
    var a = new Date(dateStr + "T00:00:00");
    var b = new Date(today() + "T00:00:00");
    if (isNaN(a)) return null;
    return Math.round((b - a) / 86400000);
  }
  function formatDate(dateStr) {
    var p = (dateStr || "").split("-");
    return p.length === 3 ? p[0] + "." + p[1] + "." + p[2] : dateStr;
  }
  function lastVisit(m) {
    if (!m.visits || !m.visits.length) return null;
    return m.visits.slice().sort(function (a, b) {
      return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
    })[0];
  }

  /* ---------- 심방 간격 상태 ---------- */
  function careLevel(days) {
    if (days === null) return "none";
    if (days >= 90) return "late";
    if (days >= 60) return "warn";
    return "ok";
  }
  function badgeText(days) {
    if (days === null) return "기록 없음";
    if (days === 0) return "오늘";
    if (days === 1) return "어제";
    return days + "일 전";
  }

  /* ---------- 화면 그리기 ---------- */
  function districts() {
    var seen = {};
    state.members.forEach(function (m) {
      var d = (m.district || "").trim() || "미배정";
      seen[d] = true;
    });
    return Object.keys(seen).sort(function (a, b) {
      if (a === "미배정") return 1;
      if (b === "미배정") return -1;
      return a.localeCompare(b, "ko");
    });
  }

  function render() {
    renderStats();
    renderDistrictOptions();
    renderBoard();
  }

  function renderStats() {
    var total = state.members.length, warn = 0, late = 0;
    state.members.forEach(function (m) {
      var lv = lastVisit(m);
      var d = lv ? daysSince(lv.date) : null;
      var level = careLevel(d);
      if (level === "warn") warn++;
      if (level === "late" || level === "none") late++;
    });
    $("statTotal").textContent = total;
    $("statWarn").textContent = warn;
    $("statLate").textContent = late;
  }

  function renderDistrictOptions() {
    var list = districts();
    var sel = $("districtFilter");
    var cur = sel.value;
    sel.innerHTML = '<option value="">전체 구역</option>';
    list.forEach(function (d) {
      var o = document.createElement("option");
      o.value = d; o.textContent = d;
      sel.appendChild(o);
    });
    sel.value = list.indexOf(cur) >= 0 ? cur : "";

    var dl = $("districtList");
    dl.innerHTML = "";
    list.filter(function (d) { return d !== "미배정"; }).forEach(function (d) {
      var o = document.createElement("option");
      o.value = d;
      dl.appendChild(o);
    });
  }

  function matches(m, q) {
    if (!q) return true;
    var hay = [m.name, m.role, m.district, m.contact, m.memo].join(" ").toLowerCase();
    return hay.indexOf(q) >= 0;
  }

  function renderBoard() {
    var board = $("board");
    var q = $("q").value.trim().toLowerCase();
    var filter = $("districtFilter").value;
    board.innerHTML = "";

    if (!state.members.length) {
      board.innerHTML =
        '<div class="empty">아직 등록된 성도가 없습니다.<br />' +
        '위의 <b>＋ 성도 추가</b> 로 구역 식구를 등록해 주세요.</div>';
      return;
    }

    var shown = 0;
    districts().forEach(function (d) {
      if (filter && d !== filter) return;
      var members = state.members.filter(function (m) {
        return ((m.district || "").trim() || "미배정") === d && matches(m, q);
      });
      if (!members.length) return;

      // 심방이 오래된 순으로 — 먼저 챙겨야 할 분이 위로
      members.sort(function (a, b) {
        var la = lastVisit(a), lb = lastVisit(b);
        if (!la && !lb) return a.name.localeCompare(b.name, "ko");
        if (!la) return -1;
        if (!lb) return 1;
        return la.date < lb.date ? -1 : la.date > lb.date ? 1 : 0;
      });
      shown += members.length;

      var wrap = document.createElement("section");
      wrap.className = "district";

      var h2 = document.createElement("h2");
      h2.textContent = d;
      var small = document.createElement("small");
      small.textContent = members.length + "명";
      h2.appendChild(small);
      wrap.appendChild(h2);

      var list = document.createElement("div");
      list.className = "list";
      members.forEach(function (m) { list.appendChild(memberRow(m)); });
      wrap.appendChild(list);
      board.appendChild(wrap);
    });

    if (!shown) {
      board.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
    }
  }

  function memberRow(m) {
    var lv = lastVisit(m);
    var days = lv ? daysSince(lv.date) : null;
    var level = careLevel(days);

    var row = document.createElement("button");
    row.type = "button";
    row.className = "row";
    row.addEventListener("click", function () { openDetail(m.id); });

    var who = document.createElement("div");
    who.className = "who";

    var name = document.createElement("div");
    name.className = "name";
    name.textContent = m.name;
    if (m.role) {
      var role = document.createElement("span");
      role.className = "role";
      role.textContent = m.role;
      name.appendChild(role);
    }
    who.appendChild(name);

    var last = document.createElement("div");
    last.className = "last";
    last.textContent = lv
      ? "최근 심방 " + formatDate(lv.date) + (lv.kind ? " · " + lv.kind : "") +
        (lv.note ? " · " + lv.note.replace(/\s+/g, " ") : "")
      : "심방 기록이 없습니다";
    who.appendChild(last);
    row.appendChild(who);

    var badge = document.createElement("span");
    badge.className = "badge " + level;
    badge.textContent = badgeText(days);
    row.appendChild(badge);

    return row;
  }

  /* ---------- 성도 추가 / 수정 ---------- */
  function openMemberDlg(id) {
    editingMemberId = id || null;
    var m = id ? findMember(id) : null;
    $("memberDlgTitle").textContent = m ? "성도 정보 수정" : "성도 추가";
    $("mName").value = m ? m.name : "";
    $("mRole").value = m ? (m.role || "") : "";
    $("mDistrict").value = m ? (m.district || "") : ($("districtFilter").value || "");
    $("mContact").value = m ? (m.contact || "") : "";
    $("mMemo").value = m ? (m.memo || "") : "";
    $("memberDelete").hidden = !m;
    $("memberDlg").showModal();
    $("mName").focus();
  }

  function findMember(id) {
    for (var i = 0; i < state.members.length; i++) {
      if (state.members[i].id === id) return state.members[i];
    }
    return null;
  }

  $("memberForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("mName").value.trim();
    if (!name) return;
    var data = {
      name: name,
      role: $("mRole").value.trim(),
      district: $("mDistrict").value.trim(),
      contact: $("mContact").value.trim(),
      memo: $("mMemo").value.trim()
    };
    if (editingMemberId) {
      var m = findMember(editingMemberId);
      if (m) { Object.keys(data).forEach(function (k) { m[k] = data[k]; }); }
    } else {
      data.id = uid();
      data.visits = [];
      state.members.push(data);
    }
    save();
    render();
    $("memberDlg").close();
    if (openMemberId) renderDetail();
  });

  $("memberCancel").addEventListener("click", function () { $("memberDlg").close(); });

  $("memberDelete").addEventListener("click", function () {
    var m = findMember(editingMemberId);
    if (!m) return;
    if (!confirm(m.name + " 님의 정보와 심방 기록을 모두 삭제할까요?")) return;
    state.members = state.members.filter(function (x) { return x.id !== m.id; });
    save();
    $("memberDlg").close();
    if (openMemberId === m.id) { $("detailDlg").close(); openMemberId = null; }
    render();
  });

  /* ---------- 상세 · 심방 기록 ---------- */
  function openDetail(id) {
    openMemberId = id;
    editingVisitId = null;
    resetVisitForm();
    renderDetail();
    $("detailDlg").showModal();
  }

  function resetVisitForm() {
    $("vDate").value = today();
    $("vKind").value = "";
    $("vNote").value = "";
    $("visitSubmit").textContent = editingVisitId ? "심방 기록 저장" : "심방 기록 추가";
    $("visitCancelEdit").hidden = !editingVisitId;
  }

  function renderDetail() {
    var m = findMember(openMemberId);
    if (!m) { $("detailDlg").close(); return; }

    $("detailName").textContent = m.name + (m.role ? " " + m.role : "");

    var meta = [(m.district || "미배정")];
    if (m.contact) meta.push(m.contact);
    var lv = lastVisit(m);
    meta.push(lv ? "최근 심방 " + formatDate(lv.date) + " (" + badgeText(daysSince(lv.date)) + ")"
                 : "심방 기록 없음");
    $("detailMeta").textContent = meta.join(" · ");

    var memoBox = $("detailMemo");
    memoBox.innerHTML = "";
    if (m.memo) {
      var p = document.createElement("p");
      p.style.whiteSpace = "pre-wrap";
      p.style.margin = "8px 0 0";
      p.style.fontSize = "14px";
      p.textContent = m.memo;
      memoBox.appendChild(p);
    }

    var visits = (m.visits || []).slice().sort(function (a, b) {
      return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
    });
    $("visitCount").textContent = visits.length ? "(" + visits.length + "회)" : "";

    var list = $("visitList");
    list.innerHTML = "";
    if (!visits.length) {
      var empty = document.createElement("p");
      empty.className = "hint";
      empty.textContent = "아직 기록이 없습니다. 위에서 첫 심방을 기록해 주세요.";
      list.appendChild(empty);
      return;
    }
    visits.forEach(function (v) {
      var box = document.createElement("div");
      box.className = "visit";

      var head = document.createElement("div");
      head.className = "vhead";
      var b = document.createElement("b");
      b.textContent = formatDate(v.date);
      head.appendChild(b);
      if (v.kind) {
        var kind = document.createElement("span");
        kind.textContent = "· " + v.kind;
        head.appendChild(kind);
      }
      var spacer = document.createElement("span");
      spacer.style.flex = "1";
      head.appendChild(spacer);

      var edit = document.createElement("button");
      edit.type = "button"; edit.className = "ghost"; edit.textContent = "수정";
      edit.addEventListener("click", function () { startEditVisit(v.id); });
      head.appendChild(edit);

      var del = document.createElement("button");
      del.type = "button"; del.className = "ghost"; del.textContent = "삭제";
      del.addEventListener("click", function () { deleteVisit(v.id); });
      head.appendChild(del);

      box.appendChild(head);

      var p = document.createElement("p");
      p.textContent = v.note;
      box.appendChild(p);
      list.appendChild(box);
    });
  }

  function startEditVisit(visitId) {
    var m = findMember(openMemberId);
    if (!m) return;
    var v = (m.visits || []).filter(function (x) { return x.id === visitId; })[0];
    if (!v) return;
    editingVisitId = visitId;
    $("vDate").value = v.date;
    $("vKind").value = v.kind || "";
    $("vNote").value = v.note || "";
    $("visitSubmit").textContent = "심방 기록 저장";
    $("visitCancelEdit").hidden = false;
    $("vNote").focus();
  }

  function deleteVisit(visitId) {
    var m = findMember(openMemberId);
    if (!m) return;
    if (!confirm("이 심방 기록을 삭제할까요?")) return;
    m.visits = (m.visits || []).filter(function (x) { return x.id !== visitId; });
    if (editingVisitId === visitId) { editingVisitId = null; }
    save();
    resetVisitForm();
    renderDetail();
    render();
  }

  $("visitForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var m = findMember(openMemberId);
    if (!m) return;
    var date = $("vDate").value;
    var note = $("vNote").value.trim();
    if (!date || !note) return;
    if (!m.visits) m.visits = [];

    if (editingVisitId) {
      var v = m.visits.filter(function (x) { return x.id === editingVisitId; })[0];
      if (v) { v.date = date; v.kind = $("vKind").value.trim(); v.note = note; }
      editingVisitId = null;
    } else {
      m.visits.push({ id: uid(), date: date, kind: $("vKind").value.trim(), note: note });
    }
    save();
    resetVisitForm();
    renderDetail();
    render();
  });

  $("visitCancelEdit").addEventListener("click", function () {
    editingVisitId = null;
    resetVisitForm();
  });

  $("detailEdit").addEventListener("click", function () { openMemberDlg(openMemberId); });
  $("detailClose").addEventListener("click", function () { $("detailDlg").close(); });
  $("detailDlg").addEventListener("close", function () { openMemberId = null; editingVisitId = null; });

  /* ---------- 내보내기 / 가져오기 ---------- */
  $("exportBtn").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "심방기록-" + today() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  $("importBtn").addEventListener("click", function () { $("importFile").click(); });

  $("importFile").addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.members)) throw new Error("형식 오류");
        if (state.members.length &&
            !confirm("현재 " + state.members.length + "명의 자료를 가져온 파일로 바꿉니다. 계속할까요?")) return;
        data.members.forEach(function (m) {
          if (!m.id) m.id = uid();
          if (!Array.isArray(m.visits)) m.visits = [];
          m.visits.forEach(function (v) { if (!v.id) v.id = uid(); });
        });
        state = { members: data.members };
        save();
        render();
      } catch (err) {
        alert("가져오기에 실패했습니다. 이 페이지에서 내보낸 JSON 파일인지 확인해 주세요.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  /* ---------- 이벤트 ---------- */
  $("addBtn").addEventListener("click", function () { openMemberDlg(null); });
  $("q").addEventListener("input", renderBoard);
  $("districtFilter").addEventListener("change", renderBoard);

  render();
})();
</script>
</body>
</html>
